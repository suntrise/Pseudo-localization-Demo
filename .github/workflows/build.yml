name: Build-All-Platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --no-interaction
      - name: Validate and test
        run: |
          poetry check --lock
          poetry run python -m compileall -q pslo.py pslo_mini.py lib
          poetry run python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zenity
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --no-interaction
      - name: Build Standard
        run: poetry run flet build ${{ matrix.platform }} --module-name pslo --artifact pseudo-localization --product "Pseudo Localization" --output dist/standard --yes
      - name: Build Mini
        run: poetry run flet build ${{ matrix.platform }} --module-name pslo_mini --artifact pseudo-localization-mini --product "Pseudo Localization Mini" --output dist/mini --yes
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist/
