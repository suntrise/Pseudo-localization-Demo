[project]
name = "pseudo-localization-demo"
version = "5.0.0"
description = ""
license = "WTFPL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.5",
    "httpx>=0.28.1,<0.29.0"
]

[dependency-groups]
dev = ["flet[all]==1.0.5"]

[tool.flet]
app.module = "pslo"
app.path = "."  

app.exclude = [".venv", "tests", "build", ".git", ".github", "dist", "docs"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
